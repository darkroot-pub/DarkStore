name: Build DarkStore Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Check signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_PASSWORD repository secret (Settings > Secrets and variables > Actions). Optional: KEY_ALIAS (default 'darkstore') and KEY_PASSWORD."
            exit 1
          fi
          test -f android/app/darkstore-release.keystore || { echo "::error::android/app/darkstore-release.keystore is missing"; exit 1; }
          test -f android/app/google-services.json || { echo "::error::android/app/google-services.json is missing"; exit 1; }

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Print APK signing certificate
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          keytool -printcert -jarfile "$APK" | grep -E "SHA1:|Owner:" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkstore-admin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
