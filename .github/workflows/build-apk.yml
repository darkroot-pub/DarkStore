name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: android-actions/setup-android@v3 used to run here. It's been
      # removed — as of mid-September 2026 Google fully removed the legacy
      # "tools" SDK package from its repository, and that action's default
      # `packages` input still asks for it, so `sdkmanager` hard-fails with
      # "Failed to find package 'tools'" and the job dies in ~15s before any
      # of the actual project builds. This is an upstream breakage affecting
      # every project still using that action's defaults, not anything in
      # this repo. GitHub's ubuntu-latest runners already ship a preinstalled
      # Android SDK with ANDROID_HOME set, and the Android Gradle Plugin
      # downloads whatever platform/build-tools versions this project needs
      # on its own during the Gradle steps below, so the step was both
      # broken and redundant.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: darkroot-store-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build unsigned release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: darkroot-store-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error