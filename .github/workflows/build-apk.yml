name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: android-actions/setup-android@v3 used to run here. It's been
      # removed — as of mid-September 2026 Google fully removed the legacy
      # "tools" SDK package from its repository, and that action's default
      # `packages` input still asks for it, so `sdkmanager` hard-fails with
      # "Failed to find package 'tools'" and the job dies in ~15s before any
      # of the actual project builds. This is an upstream breakage affecting
      # every project still using that action's defaults, not anything in
      # this repo. GitHub's ubuntu-latest runners already ship a preinstalled
      # Android SDK with ANDROID_HOME set, and the Android Gradle Plugin
      # downloads whatever platform/build-tools versions this project needs
      # on its own during the Gradle steps below, so the step was both
      # broken and redundant.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing keystore from secrets (optional)
        env:
          KS_B64: ${{ secrets.DS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "DS_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "DS_STORE_PASSWORD=${{ secrets.DS_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "DS_KEY_ALIAS=${{ secrets.DS_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "DS_KEY_PASSWORD=${{ secrets.DS_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      # Two apps are built from this repo: the user app (DarkStore) and DarkStore Admin.
      - name: Build debug APKs (user + admin)
        run: gradle assembleUserDebug assembleAdminDebug --stacktrace

      - name: Show APK signing fingerprints (needed for assetlinks.json / Firebase)
        run: |
          for apk in app/build/outputs/apk/user/debug/*.apk app/build/outputs/apk/admin/debug/*.apk; do
            echo "### Signing certificate of $(basename "$apk")" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            keytool -printcert -jarfile "$apk" | grep -E "Owner|SHA1|SHA256" | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload user debug APK
        uses: actions/upload-artifact@v4
        with:
          name: darkstore-USER-debug-apk
          path: app/build/outputs/apk/user/debug/*.apk
          if-no-files-found: error

      - name: Upload admin debug APK
        uses: actions/upload-artifact@v4
        with:
          name: darkstore-ADMIN-debug-apk
          path: app/build/outputs/apk/admin/debug/*.apk
          if-no-files-found: error

      - name: Which APK to install
        run: |
          {
            echo "### Which APK to install"
            echo "- **darkstore-USER-RELEASE-apk** - the DarkStore marketplace for everyone (package com.darkstore.darkroot). Optimised (R8)."
            echo "- **darkstore-ADMIN-RELEASE-apk** - DarkStore Admin, for the owner/admins only (package com.darkstore.darkroot.admin). Optimised (R8)."
            echo "- The *-debug-apk artifacts are for developers only: debug Compose builds are several times slower."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APKs (user + admin)
        run: gradle assembleUserRelease assembleAdminRelease --stacktrace

      - name: Upload user release APK
        uses: actions/upload-artifact@v4
        with:
          name: darkstore-USER-RELEASE-apk
          path: app/build/outputs/apk/user/release/*.apk
          if-no-files-found: error

      - name: Upload admin release APK
        uses: actions/upload-artifact@v4
        with:
          name: darkstore-ADMIN-RELEASE-apk
          path: app/build/outputs/apk/admin/release/*.apk
          if-no-files-found: error
