# Publishes the website to GitHub Pages.
# The Supabase URL and PUBLISHABLE key are written in Website/site.js (they are public by design).
# One-time: repository Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Deploy website

on:
  push:
    branches: [main]
    paths: ["Website/**", ".github/workflows/deploy-website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_DIR: Website   # folder with index.html / site.js (use "." if the site is at the repo root)

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a secret key in site.js
        run: |
          if grep -Eq "sb_secret_|service_role" "$SITE_DIR/site.js"; then echo "::error::site.js contains a secret/service key"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}
      - id: deployment
        uses: actions/deploy-pages@v4
