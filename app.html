<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Open in DarkRoot Store</title><meta name="robots" content="noindex"><meta name="theme-color" content="#f5f8fc">
<meta property="og:title" content="Open this app in DarkRoot Store"><meta property="og:description" content="Someone shared an app with you."><meta property="og:image" content="icon.png">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head><body class="card-page">
<main class="card" aria-live="polite">
  <section id="app" hidden>
    <div class="ico" id="ico"><img id="logo" alt="" referrerpolicy="no-referrer"></div>
    <h1 id="name">An app on DarkRoot Store</h1>
    <p id="by" style="margin-bottom:10px"></p>
    <div class="chips" id="chips"></div>
    <div class="shots" id="shots" hidden></div>
    <p class="desc" id="desc" hidden></p>
    <a class="btn" id="open" href="#">Open in DarkRoot Store</a>
    <p class="hint" id="status" role="status"></p>
    <div id="getbox"><p class="hint">Don't have DarkRoot Store yet?</p>
      <a class="btn ghost" data-dl data-text="Download DarkRoot Store" href="#"><span data-label>Download DarkRoot Store</span></a></div>
    <button class="btn ghost" id="copy" type="button">Copy link</button>
    <div class="mini"><img src="favicon.png" alt="">DarkRoot Store <span data-ver></span></div>
  </section>
  <section id="bad" hidden>
    <div class="ico fb"><img src="icon.png" alt="DarkRoot Store"></div>
    <h1>This link isn't valid</h1><p>Ask the person who sent it to share the app again.</p>
    <a class="btn" href="./">Go to DarkRoot Store</a>
  </section>
</main>
<script src="site.js"></script>
<script>
(function(){
  var $ = function(i){ return document.getElementById(i); };
  var id = (new URLSearchParams(location.search).get("id") || "").trim();
  if (!/^[A-Za-z0-9_.\-]{1,120}$/.test(id)) { $("bad").hidden = false; return; }
  $("app").hidden = false; DS.bind();
  var android = /Android/i.test(navigator.userAgent);
  var shareUrl = location.origin + location.pathname + "?id=" + encodeURIComponent(id);
  var intent = "intent://app/" + encodeURIComponent(id) + "#Intent;scheme=" + DS.C.SCHEME + ";package=" + DS.C.PACKAGE + ";end";
  $("open").href = android ? intent : DS.C.SCHEME + "://app/" + encodeURIComponent(id);
  function generic(){ $("ico").classList.add("fb"); $("logo").src = "icon.png"; }
  DS.get("apps/" + encodeURIComponent(id)).then(function(a){
    if (!a || a.isApproved === false || a.isSuspended === true || !a.name) { generic(); return; }
    document.title = a.name + " on DarkRoot Store"; $("name").textContent = a.name;
    if (a.developer) $("by").textContent = "by " + a.developer;
    [a.category, parseFloat(a.rating) > 0 ? "★ " + parseFloat(a.rating).toFixed(1) : "", a.version ? "v" + a.version : "", a.size].forEach(function(t){ if (t) $("chips").appendChild(DS.el("span", "chip", t)); });
    if (/^https:\/\//i.test(a.logo || "")) { $("logo").onerror = generic; $("logo").alt = a.name + " icon"; $("logo").src = a.logo; } else generic();
    if (a.description) { $("desc").textContent = a.description; $("desc").hidden = false; }
    var s = Array.isArray(a.screenshots) ? a.screenshots : String(a.screenshots || "").split(/[,|\n]/);
    s = s.map(function(x){ return String(x).trim(); }).filter(function(x){ return /^https:\/\//i.test(x); }).slice(0, 6);
    s.forEach(function(u){ $("shots").appendChild(DS.img(u, a.name + " screenshot")); }); if (s.length) $("shots").hidden = false;
  });
  $("copy").addEventListener("click", function(){ var b = this; DS.copy(shareUrl).then(function(){ b.textContent = "Link copied"; setTimeout(function(){ b.textContent = "Copy link"; }, 1800); }); });
  if (!android) { $("open").hidden = true; $("status").textContent = "DarkRoot Store is an Android app. Open this link on your Android phone."; return; }
  setTimeout(function(){ location.href = intent; }, 250);   // best effort: open the app straight away
})();
</script>
</body></html>
