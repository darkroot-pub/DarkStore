<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Dark Store Nepal • Premium Himalayan App Store</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Firebase SDK -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"
      }
    }
  </script>

  <style>
    /* ---------- NEPAL HIMALAYAN THEME ---------- */
    :root {
      --nepal-red: #dc2626;
      --nepal-blue: #2563eb;
      --everest-white: #ffffff;
      --himalaya-snow: #f0f9ff;
      --mount-everest: #4f46e5;
      --pashupati-gold: #f59e0b;
      --lumbini-green: #10b981;
      --kathmandu-dust: #94a3b8;
      --monsoon-gray: #334155;
      
      --primary: #dc2626;
      --primary-dark: #b91c1c;
      --primary-light: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --surface-0: #0a0c0f;
      --surface-1: #111317;
      --surface-2: #1a1d24;
      --surface-3: #22262e;
      --surface-4: #2d323b;
      --text-100: #ffffff;
      --text-200: #f1f5f9;
      --text-300: #cbd5e1;
      --text-400: #94a3b8;
      --border: #2d323b;
      --radius-xs: 6px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-xxl: 32px;
      --radius-full: 9999px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Poppins', 'Inter', sans-serif;
      background: var(--surface-0);
      color: var(--text-200);
      line-height: 1.6;
    }

    /* ---------- PLAY STORE ANIMATIONS ---------- */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.3); }
      50% { box-shadow: 0 0 0 12px rgba(220,38,38,0); }
    }

    @keyframes slide-fade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes scale-in {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes mountain-rise {
      from { transform: translateY(100px) scale(0.5); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes flag-wave {
      0%, 100% { transform: rotate(-2deg) scale(1); }
      50% { transform: rotate(2deg) scale(1.1); }
    }

    /* ---------- NEPAL FLAG ANIMATION ---------- */
    .nepal-flag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: linear-gradient(145deg, rgba(220,38,38,0.1), rgba(37,99,235,0.1));
      border-radius: var(--radius-full);
      border: 1px solid rgba(220,38,38,0.3);
      color: var(--text-300);
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(8px);
    }

    .nepal-flag i {
      color: var(--nepal-red);
      animation: flag-wave 3s ease-in-out infinite;
    }

    /* ---------- PLAY STYLE HEADER ---------- */
    .play-header {
      background: rgba(17, 19, 23, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(220,38,38,0.2);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .play-header h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(145deg, var(--nepal-red), var(--nepal-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    /* ---------- PLAY STYLE BOTTOM NAV ---------- */
    .play-bottom-nav {
      background: rgba(17, 19, 23, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(220,38,38,0.2);
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      padding: 12px 12px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 40;
      height: 80px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--text-400);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      position: relative;
    }

    .nav-item.active {
      color: var(--nepal-red);
    }

    .nav-icon {
      font-size: 24px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nav-item.active .nav-icon {
      transform: translateY(-4px) scale(1.2);
      color: var(--nepal-red);
      animation: float 3s ease-in-out infinite;
    }

    .nav-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .nav-item.active::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 3px;
      background: linear-gradient(90deg, var(--nepal-red), var(--nepal-blue));
      border-radius: var(--radius-full);
      animation: scale-in 0.3s ease;
    }

    /* ---------- PLAY STYLE APP CARD ---------- */
    .play-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 20px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      animation: slide-fade 0.5s ease;
    }

    .play-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--nepal-red), var(--nepal-blue));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .play-card:hover {
      transform: translateY(-4px);
      border-color: var(--nepal-red);
      box-shadow: 0 12px 24px rgba(220,38,38,0.2);
    }

    .play-card:hover::before {
      opacity: 1;
    }

    .play-card:active {
      transform: translateY(-2px) scale(0.98);
    }

    /* ---------- PLAY STYLE BUTTONS ---------- */
    .play-btn {
      padding: 20px 28px;
      border-radius: var(--radius-full);
      font-weight: 600;
      font-size: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .play-btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .play-btn:active::after {
      width: 300px;
      height: 300px;
    }

    .btn-install {
      background: var(--surface-4);
      color: var(--text-200);
    }

    .btn-install:hover {
      background: #3a3f4a;
      transform: scale(1.02);
    }

    .btn-open {
      background: linear-gradient(145deg, #059669, #10b981);
      color: white;
    }

    .btn-open:hover {
      background: linear-gradient(145deg, #047857, #059669);
    }

    .btn-update {
      background: linear-gradient(145deg, #d97706, #f59e0b);
      color: white;
      animation: pulse-glow 2s infinite;
    }

    /* ---------- PLAY STYLE DOWNLOAD PROGRESS ---------- */
    .download-progress-play {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      background: var(--surface-2);
      border: 1px solid var(--nepal-red);
      border-radius: var(--radius-xxl);
      padding: 24px;
      z-index: 200;
      backdrop-filter: blur(20px);
      box-shadow: 0 16px 32px rgba(220,38,38,0.3);
      animation: slide-up 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slide-up {
      from { transform: translateX(-50%) translateY(50px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }

    .progress-ring-play {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: conic-gradient(var(--nepal-red) 0deg, var(--surface-4) 0deg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .progress-ring-inner {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--surface-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .progress-percent {
      font-size: 18px;
      font-weight: 700;
      color: var(--nepal-red);
    }

    .progress-speed {
      font-size: 10px;
      color: var(--text-400);
    }

    .progress-bar-play {
      width: 100%;
      height: 6px;
      background: var(--surface-4);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .progress-fill-play {
      height: 100%;
      background: linear-gradient(90deg, var(--nepal-red), var(--nepal-blue));
      transition: width 0.2s ease;
      position: relative;
    }

    .progress-fill-play::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 1.5s infinite;
    }

    /* ---------- RATING STARS ---------- */
    .rating-stars {
      display: flex;
      gap: 4px;
      color: var(--pashupati-gold);
    }

    .rating-star {
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 20px;
    }

    .rating-star:hover {
      transform: scale(1.2);
    }

    .rating-star.active {
      color: var(--pashupati-gold);
    }

    /* ---------- REVIEW CARD ---------- */
    .review-card {
      background: var(--surface-3);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 12px;
      animation: slide-fade 0.4s ease;
    }

    /* ---------- CATEGORY PILLS ---------- */
    .category-pill {
      padding: 10px 24px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      color: var(--text-300);
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .category-pill.active {
      background: linear-gradient(145deg, var(--nepal-red), var(--nepal-blue));
      color: white;
      border-color: transparent;
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(220,38,38,0.3);
    }

    /* ---------- SEARCH BAR ---------- */
    .search-container {
      position: sticky;
      top: 0;
      z-index: 25;
      padding: 8px 0 16px;
      background: var(--surface-0);
    }

    .search-input {
      width: 100%;
      padding: 16px 24px 16px 56px;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-full);
      color: var(--text-200);
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--nepal-red);
      box-shadow: 0 0 0 4px rgba(220,38,38,0.1);
      background: var(--surface-1);
    }

    .search-icon {
      position: absolute;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-400);
    }

    /* ---------- GRID/VIEW TOGGLE ---------- */
    .view-toggle {
      display: flex;
      gap: 8px;
      padding: 4px;
      background: var(--surface-2);
      border-radius: var(--radius-full);
    }

    .view-btn {
      padding: 8px 16px;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--text-400);
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .view-btn.active {
      background: var(--surface-1);
      color: var(--text-200);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* ---------- TOAST NOTIFICATION ---------- */
    .toast-play {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-2);
      border-left: 4px solid var(--nepal-red);
      border-radius: var(--radius-lg);
      padding: 16px 24px;
      box-shadow: 0 16px 32px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 9999;
      backdrop-filter: blur(20px);
      animation: toast-slide 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      min-width: 300px;
      max-width: 90%;
    }

    @keyframes toast-slide {
      from { transform: translateX(-50%) translateY(50px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }

    /* ---------- MODAL OVERLAY ---------- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-xxl);
      max-width: 500px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      animation: scale-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      scrollbar-width: thin;
    }

    .modal-content::-webkit-scrollbar {
      width: 4px;
    }

    .modal-content::-webkit-scrollbar-thumb {
      background: var(--nepal-red);
      border-radius: var(--radius-full);
    }

    /* ---------- SCREENSHOT GALLERY ---------- */
    .screenshot-gallery {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 8px 0;
      scrollbar-width: thin;
    }

    .screenshot-gallery::-webkit-scrollbar {
      height: 4px;
    }

    .screenshot-gallery::-webkit-scrollbar-thumb {
      background: var(--nepal-red);
      border-radius: var(--radius-full);
    }

    .screenshot-item {
      flex: 0 0 200px;
      height: 120px;
      border-radius: var(--radius-md);
      object-fit: cover;
      border: 1px solid var(--border);
      transition: transform 0.2s ease;
    }

    .screenshot-item:hover {
      transform: scale(1.02);
    }

    /* ---------- LOADING SCREEN ---------- */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--surface-0);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }

    .himalaya-loader {
      position: relative;
      width: 200px;
      height: 100px;
      margin-bottom: 40px;
    }

    .mountain {
      position: absolute;
      bottom: 0;
      width: 0;
      height: 0;
      border-left: 50px solid transparent;
      border-right: 50px solid transparent;
      border-bottom: 80px solid var(--nepal-red);
      animation: mountain-rise 1s ease-out;
    }

    .mountain1 {
      left: 0;
      border-bottom-color: var(--nepal-red);
    }

    .mountain2 {
      left: 40px;
      border-bottom-color: var(--nepal-blue);
      animation-delay: 0.2s;
    }

    .mountain3 {
      left: 80px;
      border-bottom-color: var(--primary-light);
      animation-delay: 0.4s;
    }

    .sun {
      position: absolute;
      top: 0;
      right: 20px;
      width: 40px;
      height: 40px;
      background: var(--pashupati-gold);
      border-radius: 50%;
      box-shadow: 0 0 40px var(--pashupati-gold);
      animation: pulse-glow 2s infinite;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--surface-4);
      border-top: 4px solid var(--nepal-red);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ---------- GRID/LAYOUT ---------- */
    .grid-view {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .list-view {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #app {
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 90px;
      min-height: 100vh;
      position: relative;
      background: var(--surface-0);
    }

    .content {
      padding: 20px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    // ---------- FIREBASE INIT ----------
    import { initializeApp } from 'firebase/app';
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged
    } from 'firebase/auth';
    import { 
      getFirestore, 
      collection, 
      query, 
      where, 
      getDocs, 
      doc, 
      getDoc, 
      setDoc, 
      updateDoc,
      addDoc,
      serverTimestamp,
      increment,
      limit
    } from 'firebase/firestore';

    // ---------- FIREBASE CONFIG ----------
    const firebaseConfig = {
      apiKey: "AIzaSyDKbvTtEAdz0thLZgG76mHW5FJFJqvzEf8",
      authDomain: "dark-store-6ef63.firebaseapp.com",
      projectId: "dark-store-6ef63",
      storageBucket: "dark-store-6ef63.firebasestorage.app",
      messagingSenderId: "280205108483",
      appId: "1:280205108483:web:8246030fd3f3e91d0fb536"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ---------- GLOBAL STATE ----------
    const state = {
      currentUser: null,
      currentUserRole: 'guest',
      userProfile: null,
      allApps: [],
      userDownloads: new Map(),
      activeDownloads: new Map(),
      currentView: 'browse',
      viewMode: localStorage.getItem('viewMode') || 'list',
      selectedCategory: 'all',
      searchQuery: '',
      isLoading: true,
      theme: 'dark',
      cache: {
        apps: null,
        lastFetch: 0,
        downloads: null,
        downloadsLastFetch: 0
      }
    };

    const appEl = document.getElementById('app');

    // ---------- TOAST NOTIFICATION ----------
    function showToast(message, type = 'info', duration = 3000) {
      const existingToast = document.querySelector('.toast-play');
      if (existingToast) existingToast.remove();

      const toast = document.createElement('div');
      toast.className = 'toast-play';
      
      const colors = {
        success: '#10b981',
        warning: '#f59e0b',
        error: '#ef4444',
        info: '#dc2626'
      };

      toast.innerHTML = `
        <i class="fas ${type === 'success' ? 'fa-check-circle' : 
                       type === 'warning' ? 'fa-exclamation-triangle' : 
                       type === 'error' ? 'fa-times-circle' : 
                       'fa-info-circle'}" 
           style="color: ${colors[type]}; font-size: 20px;"></i>
        <span style="flex: 1; font-weight: 500;">${message}</span>
        <button onclick="this.parentElement.remove()" style="background: none; border: none; color: var(--text-400); cursor: pointer;">
          <i class="fas fa-times"></i>
        </button>
      `;

      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), duration);
    }

    // ---------- LOADING SCREEN ----------
    function showLoadingScreen() {
      const loading = document.createElement('div');
      loading.className = 'loading-screen';
      loading.innerHTML = `
        <div class="himalaya-loader">
          <div class="mountain mountain1"></div>
          <div class="mountain mountain2"></div>
          <div class="mountain mountain3"></div>
          <div class="sun"></div>
        </div>
        <h1 style="font-size: 28px; font-weight: 800; background: linear-gradient(145deg, var(--nepal-red), var(--nepal-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 16px;">
          Dark Store Nepal
        </h1>
        <p style="color: var(--text-400);">सगरमाथाको उचाइ जत्तिकै गुणस्तर</p>
        <div style="width: 200px; margin-top: 32px;">
          <div class="progress-bar-play">
            <div class="progress-fill-play" style="width: 60%;"></div>
          </div>
        </div>

    // ---------- FETCH APPS - FIXED (NO INDEX NEEDED) ----------
    async function fetchApprovedApps(force = false) {
      try {
        if (!force && state.cache.apps && Date.now() - state.cache.lastFetch < 300000) {
          return state.cache.apps;
        }

        const appsRef = collection(db, 'apps');
        const q = query(appsRef, where('status', '==', 'approved'));
        const snapshot = await getDocs(q);
        
        const apps = snapshot.docs
          .map(doc => ({ 
            id: doc.id, 
            ...doc.data() 
          }))
          .sort((a, b) => {
            const aTime = a.createdAt?.toDate?.() || new Date(0);
            const bTime = b.createdAt?.toDate?.() || new Date(0);
            return bTime - aTime;
          });
        
        state.cache.apps = apps;
        state.cache.lastFetch = Date.now();
        state.allApps = apps;
        
        return apps;
      } catch (e) {
        console.error('Fetch apps error:', e);
        if (e.code === 'failed-precondition') {
          showToast('⚠️ Using offline mode', 'warning', 3000);
          return state.cache.apps || [];
        }
        showToast('Failed to load apps', 'error');
        return [];
      }
    }

    // ---------- FETCH USER DOWNLOADS ----------
    async function fetchUserDownloads(uid, force = false) {
      if (!uid) return new Map();
      
      try {
        if (!force && state.cache.downloads && Date.now() - state.cache.downloadsLastFetch < 30000) {
          return state.cache.downloads;
        }

        const downloadsRef = collection(db, 'users', uid, 'downloads');
        const snapshot = await getDocs(downloadsRef);
        
        const downloads = new Map();
        snapshot.forEach(doc => {
          const data = doc.data();
          downloads.set(doc.id, data);
        });
        
        state.userDownloads = downloads;
        state.cache.downloads = downloads;
        state.cache.downloadsLastFetch = Date.now();
        
        return downloads;
      } catch (e) {
        console.warn('Fetch downloads error:', e);
        return state.userDownloads || new Map();
      }
    }

    // ---------- FETCH REVIEWS ----------
    async function fetchReviews(appId) {
      try {
        const reviewsRef = collection(db, 'apps', appId, 'reviews');
        const q = query(reviewsRef, limit(20));
        const snapshot = await getDocs(q);
        const reviews = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        
        return reviews.sort((a, b) => {
          const aTime = a.createdAt?.toDate?.() || new Date(0);
          const bTime = b.createdAt?.toDate?.() || new Date(0);
          return bTime - aTime;
        });
      } catch (e) {
        console.error('Fetch reviews error:', e);
        return [];
      }
    }

    // ---------- SUBMIT RATING ----------
    async function submitRating(appId, rating, comment) {
      if (!state.currentUser) {
        showToast('Please sign in to rate', 'warning');
        return false;
      }

      try {
        const reviewRef = collection(db, 'apps', appId, 'reviews');
        const q = query(reviewRef, where('userId', '==', state.currentUser.uid));
        const snapshot = await getDocs(q);

        if (!snapshot.empty) {
          const reviewDoc = snapshot.docs[0];
          await updateDoc(reviewDoc.ref, {
            rating,
            comment,
            updatedAt: serverTimestamp()
          });
          showToast('⭐ Review updated!', 'success');
        } else {
          await addDoc(reviewRef, {
            userId: state.currentUser.uid,
            userName: state.userProfile?.name || state.currentUser.email?.split('@')[0],
            rating,
            comment,
            createdAt: serverTimestamp()
          });
          showToast('⭐ Thanks for rating!', 'success');
        }

        const allReviews = await fetchReviews(appId);
        const avgRating = allReviews.reduce((acc, r) => acc + r.rating, 0) / allReviews.length;
        const appRef = doc(db, 'apps', appId);
        await updateDoc(appRef, { rating: avgRating });

        return true;
      } catch (e) {
        console.error('Rating error:', e);
        showToast('Failed to submit rating', 'error');
        return false;
      }
    }

    // ---------- DOWNLOAD APK WITH PROGRESS ----------
    async function downloadAPK(url, filename, app) {
      return new Promise((resolve, reject) => {
        let progressDiv = document.getElementById('download-progress-play');
        if (!progressDiv) {
          progressDiv = document.createElement('div');
          progressDiv.id = 'download-progress-play';
          progressDiv.className = 'download-progress-play';
          document.body.appendChild(progressDiv);
        }

        progressDiv.innerHTML = `
          <div style="display: flex; gap: 20px; align-items: center;">
            <div class="progress-ring-play" id="progress-ring">
              <div class="progress-ring-inner">
                <span class="progress-percent" id="download-percent">0%</span>
                <span class="progress-speed" id="download-speed">0 KB/s</span>
              </div>
            </div>
            <div style="flex: 1;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                <h3 style="font-weight: 700;">${app.name}</h3>
                <span style="color: var(--nepal-red); font-weight: 700;" id="download-size">0 MB</span>
              </div>
              <div class="progress-bar-play">
                <div class="progress-fill-play" id="progress-fill" style="width: 0%;"></div>
              </div>
              <div style="display: flex; justify-content: space-between; margin-top: 12px;">
                <span style="font-size: 12px; color: var(--text-400);" id="download-status">
                  <i class="fas fa-download"></i> Starting...
                </span>
                <button id="cancel-download" style="background: none; border: none; color: var(--error); cursor: pointer;">
                  <i class="fas fa-times-circle"></i> Cancel
                </button>
              </div>
            </div>
          </div>
        `;

        const xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.responseType = 'blob';

        let startTime = Date.now();
        let lastLoaded = 0;

        xhr.addEventListener('progress', (e) => {
          if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            const loadedMB = (e.loaded / (1024 * 1024)).toFixed(2);
            const totalMB = (e.total / (1024 * 1024)).toFixed(2);
            
            const degrees = (percent / 100) * 360;
            const ring = document.getElementById('progress-ring');
            if (ring) ring.style.background = `conic-gradient(var(--nepal-red) ${degrees}deg, var(--surface-4) 0deg)`;
            
            const percentEl = document.getElementById('download-percent');
            if (percentEl) percentEl.textContent = `${percent}%`;
            
            const sizeEl = document.getElementById('download-size');
            if (sizeEl) sizeEl.textContent = `${loadedMB} / ${totalMB} MB`;
            
            const fill = document.getElementById('progress-fill');
            if (fill) fill.style.width = `${percent}%`;
            
            const now = Date.now();
            const elapsed = (now - startTime) / 1000;
            const speed = e.loaded / elapsed;
            const speedKB = (speed / 1024).toFixed(0);
            
            const speedEl = document.getElementById('download-speed');
            if (speedEl) speedEl.textContent = `${speedKB} KB/s`;
            
            const statusEl = document.getElementById('download-status');
            if (statusEl) statusEl.innerHTML = `<i class="fas fa-download"></i> Downloading... ${percent}%`;
          }
        });

        xhr.addEventListener('load', async () => {
          if (xhr.status === 200) {
            const statusEl = document.getElementById('download-status');
            if (statusEl) statusEl.innerHTML = `<i class="fas fa-check-circle" style="color: var(--success);"></i> Installing...`;
            
            const blob = xhr.response;
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = filename.endsWith('.apk') ? filename : `${filename}.apk`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(downloadUrl);
            document.body.removeChild(a);
            
            setTimeout(() => {
              progressDiv.remove();
            }, 2000);
            
            resolve(blob);
          } else {
            reject(new Error('Download failed'));
          }
        });

        xhr.addEventListener('error', () => {
          progressDiv.remove();
          reject(new Error('Network error'));
        });

        document.getElementById('cancel-download')?.addEventListener('click', () => {
          xhr.abort();
          progressDiv.remove();
          showToast('Download cancelled', 'warning');
          reject(new Error('Cancelled'));
        });

        xhr.send();
      });
    }

    // ---------- GET BUTTON STATE ----------
    function getAppButtonState(app) {
      if (!state.currentUser) return { label: 'Install', className: 'btn-install' };
      const downloaded = state.userDownloads?.get(app.id);
      if (!downloaded) return { label: 'Install', className: 'btn-install' };
      if (downloaded.version === app.version) return { label: 'Open', className: 'btn-open' };
      return { label: 'Update', className: 'btn-update' };
    }

    // ---------- HANDLE APP ACTION ----------
    async function handleAppAction(app, e) {
      e?.preventDefault();
      e?.stopPropagation();

      if (!state.currentUser) {
        showToast('Please sign in to install apps', 'warning');
        renderAuthView();
        return;
      }

      const btnState = getAppButtonState(app);

      if (btnState.label === 'Open') {
        showToast(`🚀 Opening ${app.name}`, 'success');
        return;
      }

      if (app.apkUrl) {
        try {
          await downloadAPK(app.apkUrl, `${app.name}_v${app.version}.apk`, app);
          
          const downloadRef = doc(db, 'users', state.currentUser.uid, 'downloads', app.id);
          await setDoc(downloadRef, {
            appId: app.id,
            appName: app.name,
            version: app.version,
            timestamp: serverTimestamp()
          });

          await fetchUserDownloads(state.currentUser.uid, true);
          
          showToast(`✅ ${app.name} ${btnState.label === 'Update' ? 'updated' : 'installed'}`, 'success');
          
          if (state.currentView === 'browse') await renderBrowseView();
          else if (state.currentView === 'installed') await renderInstalledView();
          
        } catch (error) {
          if (error.message !== 'Cancelled') {
            showToast('Download failed', 'error');
          }
        }
      }
    }

              <div class="nepal-flag" style="margin-bottom: 8px;">
                <i class="fas fa-flag"></i> <h1 style="font-size: 18px; font-weight: 800; background: linear-gradient(145deg, var(--nepal-red), var(--nepal-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                नमस्ते, ${state.userProfile?.name || state.currentUser?.email?.split('@')[0] || 'Explorer'}!
              </h1>
              </div>
             
            </div>
            <div style="width: 40px; height: 40px; background: var(--surface-3); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
              <i class="fas fa-user-circle" style="font-size: 32px; color: var(--nepal-red);"></i>
            </div>
          </div>

          <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="search" id="search-input" class="search-input" placeholder="Search apps, games, tools...">
          </div>

          <div style="display: flex; gap: 12px; overflow-x: auto; margin-bottom: 24px; padding-bottom: 8px;">
            <button data-cat="all" class="category-pill active">सबै (All)</button>
            ${['Games', 'Productivity', 'Social', 'Education', 'Entertainment', 'Tools', 'Nepali'].map(cat => `
              <button data-cat="${cat}" class="category-pill">${cat}</button>
            `).join('')}
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <i class="fas fa-crown" style="color: var(--pashupati-gold);"></i>
              <span style="font-weight: 600;">${apps.length} Apps Available</span>
            </div>
            <div class="view-toggle">
              <button id="grid-view" class="view-btn ${state.viewMode === 'grid' ? 'active' : ''}">
                <i class="fas fa-grid-2"></i>
              </button>
              <button id="list-view" class="view-btn ${state.viewMode === 'list' ? 'active' : ''}">
                <i class="fas fa-list"></i>
              </button>
            </div>
          </div>

          <div id="apps-container" class="${state.viewMode === 'grid' ? 'grid-view' : 'list-view'}"></div>
        </div>

        ${renderBottomNav('browse')}
      `;

      renderApps(apps);
      attachBrowseListeners();
    }

    function renderApps(apps) {
      const container = document.getElementById('apps-container');
      if (!container) return;
      
      const searchInput = document.getElementById('search-input');
      const searchQuery = searchInput?.value?.toLowerCase() || '';
      const activeCat = document.querySelector('.category-pill.active')?.dataset.cat || 'all';

      const filtered = apps.filter(app => {
        const matchesSearch = !searchQuery || 
          app.name?.toLowerCase().includes(searchQuery) || 
          app.description?.toLowerCase().includes(searchQuery);
        const matchesCat = activeCat === 'all' || app.category === activeCat;
        return matchesSearch && matchesCat;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 64px 24px; background: var(--surface-2); border-radius: var(--radius-xl); grid-column: span 2;">
            <i class="fas fa-mountain" style="font-size: 64px; color: var(--text-400); margin-bottom: 16px;"></i>
            <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">खोजी नमिलेको</h3>
            <p style="color: var(--text-400);">No apps found. Try another search!</p>
          </div>
        `;
        return;
      }

      if (state.viewMode === 'grid') {
        container.innerHTML = filtered.map(app => {
          const btnState = getAppButtonState(app);
          return `
            <div class="play-card" data-app-id="${app.id}" style="padding: 16px;">
              <img src="${app.icon || 'https://via.placeholder.com/80x80/1e1e26/dc2626?text=📦'}" 
                   style="width: 100%; aspect-ratio: 1; border-radius: var(--radius-md); margin-bottom: 12px; object-fit: cover;">
              <h3 style="font-weight: 700; font-size: 15px; margin-bottom: 4px;">${app.name}</h3>
              <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
                <span style="font-size: 12px; color: var(--text-400);">${app.category}</span>
                <div style="display: flex; align-items: center; gap: 4px;">
                  <i class="fas fa-star" style="color: var(--pashupati-gold); font-size: 11px;"></i>
                  <span style="font-size: 11px;">${(app.rating || 4.5).toFixed(1)}</span>
                </div>
              </div>
              <button data-app-id="${app.id}" class="play-btn ${btnState.className}" style="width: 100%; padding: 10px;">
                <i class="fas ${btnState.label === 'Install' ? 'fa-download' : btnState.label === 'Update' ? 'fa-sync-alt' : 'fa-play'}"></i>
                ${btnState.label}
              </button>
            </div>
          `;
        }).join('');
      } else {
        container.innerHTML = filtered.map(app => {
          const btnState = getAppButtonState(app);
          return `
            <div class="play-card" data-app-id="${app.id}" style="display: flex; gap: 16px; align-items: center;">
              <img src="${app.icon || 'https://via.placeholder.com/70x70/1e1e26/dc2626?text=📦'}" 
                   style="width: 70px; height: 70px; border-radius: var(--radius-md); object-fit: cover;">
              <div style="flex: 1;">
                <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 4px;">
                  <h3 style="font-weight: 700;">${app.name}</h3>
                  <span style="font-size: 11px; padding: 4px 8px; background: var(--surface-3); border-radius: var(--radius-full);">
                    v${app.version}
                  </span>
                </div>
                <p style="font-size: 12px; color: var(--text-400); margin-bottom: 8px;">${app.category}</p>
                <div style="display: flex; align-items: center; gap: 12px;">
                  <span style="display: flex; align-items: center; gap: 4px;">
                    <i class="fas fa-star" style="color: var(--pashupati-gold); font-size: 11px;"></i>
                    <span style="font-size: 11px;">${(app.rating || 4.5).toFixed(1)}</span>
                  </span>
                  <span style="font-size: 11px; color: var(--text-400);">
                    <i class="fas fa-download"></i> ${formatNumber(app.totalDownloads || 0)}
                  </span>
                </div>
              </div>
              <button data-app-id="${app.id}" class="play-btn ${btnState.className}" style="padding: 10px 20px;">
                <i class="fas ${btnState.label === 'Install' ? 'fa-download' : btnState.label === 'Update' ? 'fa-sync-alt' : 'fa-play'}"></i>
                ${btnState.label}
              </button>
            </div>
          `;
        }).join('');
      }

      container.querySelectorAll('.play-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (!e.target.classList.contains('play-btn')) {
            const appId = card.dataset.appId;
            const app = state.allApps.find(a => a.id === appId);
            if (app) showAppDetails(app);
          }
        });
      });

      container.querySelectorAll('.play-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const appId = btn.dataset.appId;
          const app = state.allApps.find(a => a.id === appId);
          if (app) await handleAppAction(app, e);
        });
      });
    }

    // ---------- RENDER INSTALLED ----------
    async function renderInstalledView() {
      if (!state.currentUser) {
        renderAuthView();
        return;
      }

      state.currentView = 'installed';
      await fetchUserDownloads(state.currentUser.uid);
      
      const installed = Array.from(state.userDownloads.values()).map(d => {
        const app = state.allApps.find(a => a.id === d.appId);
        return { ...d, ...app, id: d.appId };
      });

      appEl.innerHTML = `
        <div class="content">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
            <h1 style="font-size: 28px; font-weight: 800; background: linear-gradient(145deg, var(--nepal-red), var(--nepal-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
              मेरो Apps
            </h1>
            <span class="nepal-flag">
              <i class="fas fa-box"></i> ${installed.length} installed
            </span>
          </div>

          <div style="display: flex; flex-direction: column; gap: 16px;">
            ${installed.length === 0 ? `
              <div style="text-align: center; padding: 64px 24px; background: var(--surface-2); border-radius: var(--radius-xl);">
                <i class="fas fa-mountain" style="font-size: 64px; color: var(--text-400); margin-bottom: 16px;"></i>
                <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">कुनै Apps छैन</h3>
                <p style="color: var(--text-400); margin-bottom: 24px;">No apps installed yet</p>
                <button onclick="window.renderBrowseView()" class="play-btn btn-install" style="padding: 14px 32px;">
                  <i class="fas fa-store"></i> Browse Store
                </button>
              </div>
            ` : installed.map(app => {
              const hasUpdate = app.version !== app.installedVersion;
              return `
                <div class="play-card" data-app-id="${app.id}" style="display: flex; gap: 16px; align-items: center;">
                  <img src="${app.icon || 'https://via.placeholder.com/60x60/1e1e26/dc2626?text=📦'}" 
                       style="width: 60px; height: 60px; border-radius: var(--radius-md);">
                  <div style="flex: 1;">
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                      <h3 style="font-weight: 700;">${app.name}</h3>
                      <span style="font-size: 11px; padding: 4px 8px; background: var(--surface-3); border-radius: var(--radius-full);">
                        v${app.installedVersion}
                      </span>
                      ${hasUpdate ? `
                        <span class="nepal-flag" style="background: rgba(245,158,11,0.1); color: var(--warning);">
                          <i class="fas fa-arrow-up"></i> Update
                        </span>
                      ` : ''}
                    </div>
                    <p style="font-size: 12px; color: var(--text-400);">${app.category}</p>
                  </div>
                  <button data-app-id="${app.id}" class="play-btn ${hasUpdate ? 'btn-update' : 'btn-open'}" style="padding: 10px 20px;">
                    <i class="fas ${hasUpdate ? 'fa-sync-alt' : 'fa-play'}"></i>
                    ${hasUpdate ? 'Update' : 'Open'}
                  </button>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        ${renderBottomNav('installed')}
      `;

      appEl.querySelectorAll('.play-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (!e.target.classList.contains('play-btn')) {
            const appId = card.dataset.appId;
            const app = state.allApps.find(a => a.id === appId);
            if (app) showAppDetails(app);
          }
        });
      });

      appEl.querySelectorAll('.play-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const appId = btn.dataset.appId;
          const app = state.allApps.find(a => a.id === appId);
          if (app) await handleAppAction(app, e);
        });
      });
    }

    // ---------- RENDER PROFILE ----------
    async function renderProfileView() {
      if (!state.currentUser) {
        renderAuthView();
        return;
      }

      state.currentView = 'profile';
      
      const userDoc = await getDoc(doc(db, 'users', state.currentUser.uid));
      const userData = userDoc.data() || {};

      appEl.innerHTML = `
        <div class="content">
          <div style="position: relative; margin-bottom: 32px;">
            <div style="height: 120px; background: linear-gradient(145deg, var(--nepal-red), var(--nepal-blue)); border-radius: var(--radius-xl);"></div>
            <div style="display: flex; flex-direction: column; align-items: center; margin-top: -50px;">
              <div style="width: 100px; height: 100px; background: var(--surface-2); border-radius: 50%; border: 4px solid var(--surface-1); display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-user-circle" style="font-size: 64px; color: var(--nepal-red);"></i>
              </div>
              <h2 style="font-size: 24px; font-weight: 700; margin-top: 12px;">
                ${userData.name || state.currentUser.email?.split('@')[0]}
              </h2>
              <p style="color: var(--text-400);">${state.currentUser.email}</p>
              <span class="nepal-flag" style="margin-top: 12px;">
                <i class="fas fa-crown"></i> ${state.currentUserRole?.toUpperCase() || 'USER'}
              </span>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 24px;">
            <div class="play-card" style="text-align: center; padding: 20px;">
              <i class="fas fa-download" style="color: var(--nepal-red); font-size: 28px; margin-bottom: 8px;"></i>
              <p style="font-size: 24px; font-weight: 700;">${userData.totalDownloads || 0}</p>
              <p style="font-size: 12px; color: var(--text-400);">Downloads</p>
            </div>
            <div class="play-card" style="text-align: center; padding: 20px;">
              <i class="fas fa-box" style="color: var(--nepal-blue); font-size: 28px; margin-bottom: 8px;"></i>
              <p style="font-size: 24px; font-weight: 700;">${state.userDownloads.size}</p>
              <p style="font-size: 12px; color: var(--text-400);">Installed</p>
            </div>
          </div>

          <div style="background: var(--surface-2); border-radius: var(--radius-xl); padding: 24px; margin-bottom: 24px;">
            <h3 style="font-size: 16px; font-weight: 600; margin-bottom: 16px;">सेटिङ्ग (Settings)</h3>
            <button id="signout-btn" class="play-btn" style="width: 100%; padding: 16px; background: var(--surface-3); color: var(--error);">
              <i class="fas fa-sign-out-alt"></i> Sign Out
            </button>
          </div>

          <div style="background: linear-gradient(145deg, rgba(220,38,38,0.05), rgba(37,99,235,0.05)); border-radius: var(--radius-xl); padding: 24px;">
            <div style="display: flex; align-items: center; gap: 16px;">
              <div style="width: 48px; height: 48px; background: var(--nepal-red); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-flag" style="color: white; font-size: 24px;"></i>
              </div>
              <div>
                <h3 style="font-weight: 700;">Dark Store Nepal</h3>
                <p style="font-size: 12px; color: var(--text-400);">Premium Himalayan App Store</p>
                <p style="font-size: 11px; color: var(--text-400); margin-top: 4px;">Version 2.0.0 • सगरमाथा Edition</p>
              </div>
            </div>
          </div>
        </div>

        ${renderBottomNav('profile')}
      `;

      document.getElementById('signout-btn').onclick = async () => {
        await signOut(auth);
        showToast('फेरि भेटौंला! See you again!', 'success');
      };
    }

    // ---------- BOTTOM NAVIGATION ----------
    function renderBottomNav(active) {
      const navItems = [
        { id: 'browse', icon: 'store', label: 'होम' },
        { id: 'installed', icon: 'box-open', label: 'मेरो Apps' },
        { id: 'profile', icon: 'user', label: 'प्रोफाइल' }
      ];

      return `
        <nav class="play-bottom-nav">
          ${navItems.map(item => `
            <button class="nav-item ${active === item.id ? 'active' : ''}" onclick="window.navigateTo('${item.id}')">
              <i class="fas fa-${item.icon} nav-icon"></i>
              <span class="nav-label">${item.label}</span>
            </button>
          `).join('')}
        </nav>
      `;
    }

    // ---------- ATTACH LISTENERS ----------
    function attachBrowseListeners() {
      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        let timeout;
        searchInput.addEventListener('input', () => {
          clearTimeout(timeout);
          timeout = setTimeout(() => renderApps(state.allApps), 300);
        });
      }

      document.querySelectorAll('.category-pill').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.category-pill').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          renderApps(state.allApps);
        });
      });

      document.getElementById('grid-view')?.addEventListener('click', () => {
        state.viewMode = 'grid';
        localStorage.setItem('viewMode', 'grid');
        renderBrowseView();
      });

      document.getElementById('list-view')?.addEventListener('click', () => {
        state.viewMode = 'list';
        localStorage.setItem('viewMode', 'list');
        renderBrowseView();
      });
    }

    // ---------- UTILITIES ----------
    function formatNumber(num) {
      if (!num) return '0';
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toString();
    }

    function formatDate(timestamp) {
      if (!timestamp) return 'recent';
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      const now = new Date();
      const diff = now - date;
      
      if (diff < 3600000) return 'just now';
      if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
      if (diff < 604800000) return Math.floor(diff / 86400000) + 'd ago';
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // ---------- GLOBAL NAVIGATION ----------
    window.navigateTo = (view) => {
      if (view === 'browse') renderBrowseView();
      if (view === 'installed') renderInstalledView();
      if (view === 'profile') renderProfileView();
    };

    window.renderBrowseView = renderBrowseView;
    window.showToast = showToast;

    // ---------- AUTH OBSERVER ----------
    onAuthStateChanged(auth, async (user) => {
      state.currentUser = user;
      
      if (user) {
        try {
          const userDoc = await getDoc(doc(db, 'users', user.uid));
          if (userDoc.exists()) {
            state.userProfile = userDoc.data();
            state.currentUserRole = userDoc.data().role || 'user';
          }
          await fetchUserDownloads(user.uid);
          await fetchApprovedApps();
          
          showLoadingScreen();
          setTimeout(() => renderBrowseView(), 2000);
        } catch (error) {
          console.error('Auth error:', error);
          renderBrowseView();
        }
      } else {
        state.userProfile = null;
        state.currentUserRole = 'guest';
        state.userDownloads.clear();
        renderAuthView();
      }
    });

    // ---------- INIT ----------
    renderAuthView();
    setTimeout(() => fetchApprovedApps(), 1000);
  </script>
</body>
</html>
