<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dark Store Nepal • Ultimate</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- External Libs (Animations & Carousel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- Firebase SDK -->
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"
      }
    }
    </script>

    <style>
        /* --- CORE VARIABLES --- */
        :root {
            --nepal-red: #DC2626;
            --nepal-blue: #2563EB;
            --dark-bg: #030304;
            --glass-panel: rgba(20, 20, 25, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-glow: 0 0 20px rgba(220, 38, 38, 0.4);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow-x: hidden;
            padding-bottom: 90px; /* Space for bottom nav */
        }

        /* --- SCROLLBAR --- */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* --- UTILITIES --- */
        .hidden { display: none !important; }
        .gradient-text {
            background: linear-gradient(135deg, #fff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nepal-badge {
            background: linear-gradient(90deg, var(--nepal-red), var(--nepal-blue));
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: var(--neon-glow);
        }

        /* --- HEADER & HERO --- */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(3, 3, 4, 0.8);
            backdrop-filter: blur(20px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }

        .hero-swiper {
            width: 100%;
            height: 220px;
            margin-top: 10px;
            padding: 0 20px;
        }
        .swiper-slide {
            background: var(--glass-panel);
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--glass-border);
        }
        .hero-content {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, #000 0%, transparent 100%);
        }

        /* --- APP GRID & CARDS --- */
        .section-title {
            padding: 25px 20px 15px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .app-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0 20px;
        }

        .app-card {
            background: var(--glass-panel);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 15px;
            position: relative;
            transition: transform 0.1s;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .app-icon {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 16px;
            object-fit: cover;
            margin-bottom: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .download-btn {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: none;
            background: rgba(255,255,255,0.05);
            color: white;
            font-weight: 600;
            margin-top: 8px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .download-btn.active {
            background: var(--nepal-red);
            box-shadow: var(--neon-glow);
        }

        /* --- SKELETON LOADER --- */
        .skeleton {
            background: linear-gradient(90deg, #111 25%, #222 50%, #111 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* --- BOTTOM NAV --- */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            height: 70px;
            border-radius: 25px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 500;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .nav-item {
            color: var(--text-muted);
            font-size: 20px;
            transition: 0.3s var(--ease-out-expo);
            position: relative;
        }
        .nav-item.active {
            color: var(--nepal-red);
            transform: translateY(-5px);
        }
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            background: var(--nepal-red);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--nepal-red);
        }

        /* --- DOWNLOAD MANAGER (Floating) --- */
        .download-manager {
            position: fixed;
            bottom: 100px;
            left: 20px;
            right: 20px;
            background: #111;
            border: 1px solid var(--nepal-blue);
            border-radius: 16px;
            padding: 15px;
            z-index: 400;
            transform: translateY(150%);
            transition: transform 0.5s var(--ease-out-expo);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
        }
        .download-manager.show { transform: translateY(0); }
        
        .progress-bar {
            height: 4px;
            background: #333;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--nepal-red), var(--nepal-blue));
            width: 0%;
            transition: width 0.2s linear;
        }

        /* --- MODAL --- */
        .app-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }
        .app-modal.open { opacity: 1; pointer-events: all; }
        .modal-hero {
            height: 40vh;
            position: relative;
        }
        .modal-content {
            flex: 1;
            background: var(--dark-bg);
            border-radius: 30px 30px 0 0;
            margin-top: -30px;
            padding: 30px 20px;
            overflow-y: auto;
            position: relative;
            z-index: 2;
            border-top: 1px solid var(--glass-border);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div style="display: flex; gap: 12px; align-items: center;">
            <div style="width: 40px; height: 40px; background: linear-gradient(135deg, var(--nepal-red), var(--nepal-blue)); border-radius: 12px; display: grid; place-items: center; box-shadow: var(--neon-glow);">
                <i class="fas fa-mountain" style="color: white;"></i>
            </div>
            <div>
                <h1 style="font-size: 18px; font-weight: 800; margin: 0;">Dark Store</h1>
                <span style="font-size: 10px; color: var(--text-muted); letter-spacing: 2px;">NEPAL ULTIMATE</span>
            </div>
        </div>
        <div class="nepal-badge">BETA</div>
    </header>

    <!-- Main Content -->
    <main id="app">
        <!-- Hero Slider -->
        <div class="swiper hero-swiper">
            <div class="swiper-wrapper" id="hero-wrapper">
                <!-- Injected via JS -->
            </div>
            <div class="swiper-pagination"></div>
        </div>

        <!-- Categories -->
        <div style="padding: 20px; display: flex; gap: 10px; overflow-x: auto;">
            <button class="download-btn active" style="width: auto; padding: 8px 20px; border-radius: 50px;">All</button>
            <button class="download-btn" style="width: auto; padding: 8px 20px; border-radius: 50px;">Games</button>
            <button class="download-btn" style="width: auto; padding: 8px 20px; border-radius: 50px;">Tools</button>
            <button class="download-btn" style="width: auto; padding: 8px 20px; border-radius: 50px;">Nepali</button>
        </div>

        <!-- Apps Grid -->
        <div class="section-title">
            <i class="fas fa-fire" style="color: var(--nepal-red);"></i> Trending Now
        </div>
        
        <div class="app-grid" id="apps-grid">
            <!-- Skeleton Loading UI -->
            <div class="app-card"><div class="skeleton" style="width:100%; aspect-ratio:1; margin-bottom:10px;"></div><div class="skeleton" style="height:20px; width:80%;"></div></div>
            <div class="app-card"><div class="skeleton" style="width:100%; aspect-ratio:1; margin-bottom:10px;"></div><div class="skeleton" style="height:20px; width:80%;"></div></div>
        </div>
    </main>

    <!-- Library View (Hidden by default) -->
    <main id="library" class="hidden" style="padding: 20px;">
        <h1 class="gradient-text" style="font-size: 32px; font-weight: 800; margin-bottom: 20px;">My Library</h1>
        <div id="library-list" style="display: flex; flex-direction: column; gap: 15px;"></div>
    </main>

    <!-- Download Manager Float -->
    <div class="download-manager" id="dl-manager">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; gap: 10px; align-items: center;">
                <i class="fas fa-cloud-download-alt fa-bounce" style="color: var(--nepal-blue);"></i>
                <div>
                    <div style="font-size: 14px; font-weight: 700;" id="dl-name">Downloading...</div>
                    <div style="font-size: 10px; color: var(--text-muted);" id="dl-speed">0 MB/s</div>
                </div>
            </div>
            <span style="font-weight: 700; color: var(--nepal-red);" id="dl-percent">0%</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="dl-fill"></div>
        </div>
    </div>

    <!-- App Detail Modal -->
    <div class="app-modal" id="app-modal">
        <div class="modal-hero" id="modal-hero-bg" style="background: url('') center/cover;">
            <button onclick="UI.closeModal()" style="position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer;">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-content">
            <div style="display: flex; gap: 20px; margin-top: -60px; align-items: flex-end;">
                <img id="modal-icon" src="" style="width: 100px; height: 100px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 2px solid var(--dark-bg);">
                <div style="padding-bottom: 10px;">
                    <h2 id="modal-title" style="margin: 0; font-size: 24px;">Title</h2>
                    <p id="modal-cat" style="margin: 0; color: var(--nepal-blue); font-size: 14px;">Category</p>
                </div>
            </div>
            
            <div style="margin-top: 25px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <button id="modal-dl-btn" class="download-btn active" style="padding: 15px;">
                    <i class="fas fa-download"></i> Install
                </button>
                <button class="download-btn" style="padding: 15px; background: #222;">
                    <i class="fas fa-heart"></i> Save
                </button>
            </div>

            <p id="modal-desc" style="margin-top: 25px; line-height: 1.6; color: var(--text-muted);">Description goes here...</p>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="Router.go('home', this)"><i class="fas fa-home"></i></div>
        <div class="nav-item" onclick="Router.go('search', this)"><i class="fas fa-search"></i></div>
        <div class="nav-item" onclick="Router.go('library', this)"><i class="fas fa-box-open"></i></div>
        <div class="nav-item" onclick="Router.go('profile', this)"><i class="fas fa-user-astronaut"></i></div>
    </nav>

    <script type="module">
        import { initializeApp } from 'firebase/app';
        import { getFirestore, collection, getDocs, addDoc } from 'firebase/firestore';

        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyDKbvTtEAdz0thLZgG76mHW5FJFJqvzEf8",
            authDomain: "dark-store-6ef63.firebaseapp.com",
            projectId: "dark-store-6ef63",
            storageBucket: "dark-store-6ef63.firebasestorage.app",
            messagingSenderId: "280205108483",
            appId: "1:280205108483:web:8246030fd3f3e91d0fb536"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- GLOBAL STATE ---
        const State = {
            apps: [],
            downloading: null
        };

        // --- SEED DATA (If DB is empty) ---
        const SEED_APPS = [
            { id: '1', name: 'PUBG Nepal', cat: 'Games', size: '1.2 GB', icon: 'https://cdn.icon-icons.com/icons2/3053/PNG/512/pubg_mobile_macos_bigsur_icon_189879.png', desc: 'The ultimate battle royale optimized for Nepal servers.' },
            { id: '2', name: 'eSewa Pro', cat: 'Finance', size: '45 MB', icon: 'https://play-lh.googleusercontent.com/H--y2Mv4Xz_e7x7gS81F6Jz8g4F9a6_0k_s1_7q_3.png', desc: 'Modded version with dark mode and analytics.' },
            { id: '3', name: 'Hamro Patro', cat: 'Tools', size: '20 MB', icon: 'https://play-lh.googleusercontent.com/84g7HwWv_gnyW-Vf6E6E-wF_WpZqF_XpC1x4xQ', desc: 'Gold edition with no ads.' },
            { id: '4', name: 'Free Fire Max', cat: 'Games', size: '900 MB', icon: 'https://play-lh.googleusercontent.com/T0U_kXqNf5Y_tY_f3d_6q_8.png', desc: 'High graphics config unlocked.' },
            { id: '5', name: 'Pathao Driver', cat: 'Tools', size: '60 MB', icon: 'https://play-lh.googleusercontent.com/3V_5_6_7_8.png', desc: 'Early access version.' },
            { id: '6', name: 'Ludo Classic', cat: 'Games', size: '15 MB', icon: 'https://play-lh.googleusercontent.com/123.png', desc: 'No ads, unlimited coins.' }
        ];

        // --- UI RENDERER ---
        const UI = {
            // Render Hero Slider
            initHero: (apps) => {
                const wrapper = document.getElementById('hero-wrapper');
                const featured = apps.slice(0, 3);
                wrapper.innerHTML = featured.map(app => `
                    <div class="swiper-slide" onclick="UI.openModal('${app.id}')">
                        <img src="${app.icon}" style="width:100%; height:100%; object-fit:cover; opacity:0.6;">
                        <div class="hero-content">
                            <span class="nepal-badge" style="margin-bottom:8px; display:inline-block;">Featured</span>
                            <h2 style="font-size:24px; margin:0; text-shadow:0 2px 10px black;">${app.name}</h2>
                        </div>
                    </div>
                `).join('');

                new Swiper('.hero-swiper', {
                    loop: true,
                    autoplay: { delay: 3000 },
                    pagination: { el: '.swiper-pagination' },
                    effect: 'cards'
                });
            },

            // Render Main Grid with Animations
            renderGrid: (apps) => {
                const grid = document.getElementById('apps-grid');
                grid.innerHTML = apps.map(app => {
                    // Check if installed locally
                    const isInstalled = LocalStorage.has(app.id);
                    const btnText = isInstalled ? 'Open' : 'Get';
                    const btnClass = isInstalled ? 'background:#222; color:#0f0;' : '';

                    return `
                    <div class="app-card" onclick="UI.openModal('${app.id}')" onmousemove="Effects.tilt(event, this)" onmouseleave="Effects.resetTilt(this)">
                        <img src="${app.icon}" class="app-icon" onerror="this.src='https://via.placeholder.com/150/000000/FFFFFF/?text=APK'">
                        <h3 style="font-size:15px; margin:0 0 5px;">${app.name}</h3>
                        <p style="font-size:12px; color:var(--text-muted); margin:0;">${app.cat} • ${app.size}</p>
                        <button class="download-btn" style="${btnClass}" onclick="event.stopPropagation(); Logic.handleAction('${app.id}')">
                            ${isInstalled ? '<i class="fas fa-play"></i>' : '<i class="fas fa-download"></i>'} ${btnText}
                        </button>
                    </div>
                `}).join('');

                // GSAP Stagger Animation
                gsap.from(".app-card", {
                    y: 50,
                    opacity: 0,
                    duration: 0.8,
                    stagger: 0.1,
                    ease: "power3.out"
                });
            },

            // Render Library
            renderLibrary: () => {
                const list = document.getElementById('library-list');
                const installed = LocalStorage.getAll();
                
                if(installed.length === 0) {
                    list.innerHTML = `<div style="text-align:center; padding:50px; opacity:0.5;">No apps installed yet.</div>`;
                    return;
                }

                list.innerHTML = installed.map(app => `
                    <div style="background:var(--glass-panel); padding:15px; border-radius:16px; display:flex; gap:15px; align-items:center; border:1px solid var(--glass-border);">
                        <img src="${app.icon}" style="width:50px; height:50px; border-radius:12px;">
                        <div style="flex:1;">
                            <h4 style="margin:0;">${app.name}</h4>
                            <span style="font-size:11px; color:var(--nepal-blue);">Installed locally</span>
                        </div>
                        <button class="download-btn" style="width:auto; padding:8px 15px;" onclick="Logic.launchApp('${app.name}')">
                            <i class="fas fa-play"></i>
                        </button>
                    </div>
                `).join('');
            },

            openModal: (id) => {
                const app = State.apps.find(a => a.id === id);
                if(!app) return;

                document.getElementById('modal-hero-bg').style.backgroundImage = `url(${app.icon})`;
                document.getElementById('modal-icon').src = app.icon;
                document.getElementById('modal-title').innerText = app.name;
                document.getElementById('modal-cat').innerText = app.cat + " • " + app.size;
                document.getElementById('modal-desc').innerText = app.desc || "Experience the best version of this app optimized for your device.";
                
                const btn = document.getElementById('modal-dl-btn');
                const isInstalled = LocalStorage.has(id);
                btn.innerHTML = isInstalled ? '<i class="fas fa-play"></i> Open' : '<i class="fas fa-download"></i> Install';
                btn.onclick = () => Logic.handleAction(id);

                const modal = document.getElementById('app-modal');
                modal.classList.add('open');
                
                // Animate content up
                gsap.from(".modal-content", { y: 100, duration: 0.4, ease: "power2.out" });
            },

            closeModal: () => {
                document.getElementById('app-modal').classList.remove('open');
            }
        };

        // --- LOCAL STORAGE MANAGER ---
        const LocalStorage = {
            KEY: 'dark_store_lib_v3',
            getAll: () => JSON.parse(localStorage.getItem(LocalStorage.KEY) || '[]'),
            add: (app) => {
                const lib = LocalStorage.getAll();
                if(!lib.find(a => a.id === app.id)) {
                    lib.push(app);
                    localStorage.setItem(LocalStorage.KEY, JSON.stringify(lib));
                }
            },
            has: (id) => !!LocalStorage.getAll().find(a => a.id === id)
        };

        // --- BUSINESS LOGIC ---
        const Logic = {
            init: async () => {
                try {
                    const querySnapshot = await getDocs(collection(db, "apps"));
                    let apps = [];
                    querySnapshot.forEach((doc) => apps.push({ id: doc.id, ...doc.data() }));

                    if(apps.length === 0) {
                        console.log("DB Empty, Using Seed Data...");
                        apps = SEED_APPS;
                        // Optional: Upload seed to firebase here
                    }
                    
                    State.apps = apps;
                    UI.initHero(apps);
                    UI.renderGrid(apps);

                } catch (e) {
                    console.error("Firebase Error", e);
                    // Fallback to offline mode
                    State.apps = SEED_APPS;
                    UI.initHero(SEED_APPS);
                    UI.renderGrid(SEED_APPS);
                }
            },

            handleAction: (id) => {
                const app = State.apps.find(a => a.id === id);
                if(LocalStorage.has(id)) {
                    alert(`Launching ${app.name}...`);
                } else {
                    Logic.startDownload(app);
                }
            },

            launchApp: (name) => alert(`Opening ${name}...`),

            startDownload: (app) => {
                // UI Update
                UI.closeModal();
                const manager = document.getElementById('dl-manager');
                const nameEl = document.getElementById('dl-name');
                const fill = document.getElementById('dl-fill');
                const percentEl = document.getElementById('dl-percent');
                const speedEl = document.getElementById('dl-speed');

                manager.classList.add('show');
                nameEl.innerText = "Downloading " + app.name;
                
                let progress = 0;
                // Simulation Loop
                const interval = setInterval(() => {
                    progress += Math.random() * 2 + 0.5; // Random speed
                    
                    // Visual Updates
                    fill.style.width = progress + "%";
                    percentEl.innerText = Math.floor(progress) + "%";
                    speedEl.innerText = (Math.random() * 5 + 1).toFixed(1) + " MB/s";

                    if(progress >= 100) {
                        clearInterval(interval);
                        Logic.finishDownload(app);
                    }
                }, 50);
            },

            finishDownload: (app) => {
                const manager = document.getElementById('dl-manager');
                
                // 1. Trigger Particle Confetti
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.8 },
                    colors: ['#DC2626', '#2563EB', '#ffffff']
                });

                // 2. Hide Manager
                setTimeout(() => {
                    manager.classList.remove('show');
                }, 1000);

                // 3. Save to Local Storage
                LocalStorage.add(app);

                // 4. Trigger Dummy File Download
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(app));
                const anchor = document.createElement('a');
                anchor.href = dataStr;
                anchor.download = `${app.name.replace(/\s/g,'_')}_installer.apk`;
                document.body.appendChild(anchor);
                anchor.click();
                anchor.remove();

                // 5. Re-render UI
                UI.renderGrid(State.apps);
                UI.renderLibrary();
            }
        };

        // --- VISUAL EFFECTS (The "Heavy" Stuff) ---
        const Effects = {
            tilt: (e, card) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const xPct = (x / rect.width) - 0.5;
                const yPct = (y / rect.height) - 0.5;

                // 3D Transform
                card.style.transform = `rotateY(${xPct * 20}deg) rotateX(${yPct * -20}deg) scale(1.02)`;
            },
            resetTilt: (card) => {
                card.style.transform = `rotateY(0) rotateX(0) scale(1)`;
            }
        };

        // --- ROUTER ---
        const Router = {
            go: (route, el) => {
                // Nav Styles
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                if(el) el.classList.add('active');

                // View Switching
                const app = document.getElementById('app');
                const library = document.getElementById('library');

                if(route === 'home') {
                    app.classList.remove('hidden');
                    library.classList.add('hidden');
                    gsap.from("#apps-grid", { opacity:0, y:20, duration:0.5 });
                } else if (route === 'library') {
                    app.classList.add('hidden');
                    library.classList.remove('hidden');
                    UI.renderLibrary();
                } else {
                    alert("Feature coming in next update!");
                }
            }
        };

        // --- EXPOSE TO WINDOW ---
        window.UI = UI;
        window.Logic = Logic;
        window.Router = Router;
        window.Effects = Effects;

        // --- BOOTSTRAP ---
        Logic.init();

    </script>
</body>
</html>
