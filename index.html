    <style>
        /* =========================================
           ULTIMATE THEME VARIABLES
           ========================================= */
        :root {
            --primary: #DC2626; /* Nepal Crimson */
            --primary-glow: rgba(220, 38, 38, 0.5);
            --secondary: #2563EB; /* Nepal Blue */
            --secondary-glow: rgba(37, 99, 235, 0.5);

            --surface-2: #181B21;

            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --text-dim: #4B5563;

            --warning: #F59E0B;

            --nav-height: 80px;
            --header-height: 70px;
            --safe-area-top: env(safe-area-inset-top, 20px);
        }

        /* =========================================
           RESET & BASE
           ========================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 10px; }

        /* =========================================
           UTILITIES & ANIMATIONS
           ========================================= */
        .gradient-text {
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .nepal-gradient {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0px); } }
        
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* =========================================
           LAYOUT COMPONENTS
           ========================================= */
        #app-container {
            flex: 1;
            overflow-y: auto;
            padding-bottom: calc(var(--nav-height) + 20px);
            position: relative;
        }

        /* HEADER */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 50;
            padding: calc(var(--safe-area-top) + 12px) 20px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 7, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
        }

        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { 
            width: 36px; height: 36px; 
            border-radius: 10px; 
            display: grid; place-items: center;
            font-size: 18px; color: white;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* SEARCH BAR */
        .search-wrapper {
            margin: 20px;
            position: relative;

        .search-input {
            width: 100%;
            background: var(--surface-1);
            border: 1px solid var(--glass-border);
            padding: 16px 50px;
            border-radius: 20px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            transition: all 0.3s var(--ease-smooth);

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.2);
            outline: none;
            background: var(--surface-2);
        }
        .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

            padding: 0 20px;

            overflow: hidden;

        .app-icon-img {

        .btn-download {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
        }
        .btn-download.downloading {
            background: var(--surface-2);
            color: var(--warning);
            pointer-events: none;
        }
        .btn-download.installed {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.2);
        }

        /* BOTTOM NAVIGATION */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 70px;
            border-radius: 24px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;

        .nav-btn {
            background: transparent;
            border: none;

            display: flex;
            flex-direction: column;

        .nav-btn i { font-size: 22px; transition: transform 0.3s; }
        .nav-btn.active { color: var(--primary); }
        .nav-btn.active i { transform: translateY(-4px); color: var(--primary); text-shadow: 0 4px 12px var(--primary-glow); }

        /* MODAL / DETAILS */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        
        .modal-sheet {
            background: var(--surface-1);
            width: 100%;
            max-width: 500px;
            height: 85vh;
            border-radius: 32px 32px 0 0;
            border-top: 1px solid var(--glass-border);
            transform: translateY(100%);
            transition: transform 0.4s var(--ease-elastic);
            overflow-y: auto;
            position: relative;
        }
        .modal-overlay.open .modal-sheet { transform: translateY(0); }

        /* PROGRESS BAR */
        .progress-container {
            height: 6px;
            background: var(--surface-2);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
            display: none;
        }
        .progress-container.active { display: block; }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.2s linear;
        }

        /* TOAST */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid var(--glass-border);
            padding: 12px 24px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.4s var(--ease-elastic);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* Library Item specific */
        .library-meta {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.6;
        }
    </style>
</head>

    <script type="module">
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'firebase/auth';
        import { getFirestore, collection, getDocs, doc, setDoc } from 'firebase/firestore';

        // --- CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDKbvTtEAdz0thLZgG76mHW5FJFJqvzEf8",
            authDomain: "dark-store-6ef63.firebaseapp.com",
            projectId: "dark-store-6ef63",
            storageBucket: "dark-store-6ef63.firebasestorage.app",
            messagingSenderId: "280205108483",
            appId: "1:280205108483:web:8246030fd3f3e91d0fb536"

        // Initialize Firebase (Error safe)
        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.error("Firebase Init Error", e);
        }

        // --- LOCAL STORAGE MANAGER (The "Update" feature) ---
        const LocalStore = {
            KEY: 'dark_store_library_v2',
            getLibrary: () => {
                const data = localStorage.getItem(LocalStore.KEY);
                return data ? JSON.parse(data) : [];
            },
            addToLibrary: (appData) => {
                const lib = LocalStore.getLibrary();
                // Check if already exists
                if (!lib.find(item => item.id === appData.id)) {
                    lib.push({
                        ...appData,
                        installedAt: new Date().toISOString(),
                        localPath: 'Simulated Path' 
                    });
                    localStorage.setItem(LocalStore.KEY, JSON.stringify(lib));
                }
            },
            isInstalled: (id) => {
                const lib = LocalStore.getLibrary();
                return !!lib.find(item => item.id === id);
            },
            clearLibrary: () => {
                localStorage.removeItem(LocalStore.KEY);
            }
        };

        // --- STATE MANAGEMENT ---
        const State = {
            currentUser: null,
            apps: [], // Loaded from DB or Mock
            currentView: 'browse',
            searchQuery: '',
            selectedCategory: 'All',
            
            // Mock Data fallback if DB is empty or fails
            mockApps: [
                { id: '1', name: 'Pubg Mobile Nepal', category: 'Games', version: '3.1.0', size: '1.2 GB', rating: 4.8, icon: 'https://play-lh.googleusercontent.com/JRd05pyTE//Z6h87RgITkMUnkghxEwwsgSLsS1Q2XQAdbpIg' },
                { id: '2', name: 'Hamro Patro', category: 'Tools', version: '5.2.1', size: '45 MB', rating: 4.9, icon: 'https://play-lh.googleusercontent.com/84g7HwWv_gnyW-Vf6E6E-wF_WpZqF_XpC1x4xQ' },
                { id: '3', name: 'eSewa', category: 'Finance', version: '4.0.0', size: '32 MB', rating: 4.5, icon: 'https://play-lh.googleusercontent.com/H--y2Mv4Xz_e7x7' },
                { id: '4', name: 'Ludo Neo-Classic', category: 'Games', version: '1.0.5', size: '12 MB', rating: 4.2, icon: 'https://via.placeholder.com/150/DC2626/FFFFFF?text=Ludo' },

        // --- UI RENDERER ---
        const UI = {

            showToast: (msg, type = 'info') => {
                const toast = document.getElementById('toast');
                const text = document.getElementById('toast-msg');
                const icon = toast.querySelector('i');
                
                text.innerText = msg;
                icon.className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-info-circle';
                icon.style.color = type === 'success' ? 'var(--success)' : 'var(--primary)';
                
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            },

            renderHeaderAvatar: () => {
                const div = document.getElementById('header-avatar');
                if (State.currentUser) {
                    div.innerHTML = `<div style="width:36px; height:36px; border-radius:50%; background:var(--surface-2); border:1px solid var(--glass-border); display:grid; place-items:center; font-weight:700;">${State.currentUser.email[0].toUpperCase()}</div>`;

                    div.innerHTML = `<button onclick="router.navigate('auth')" style="background:var(--primary); color:white; border:none; padding:6px 14px; border-radius:20px; font-weight:600; font-size:12px;">Login</button>`;
                }
            },

            // --- VIEW: BROWSE ---
            renderBrowse: async () => {
                // Fetch apps if needed
                if(State.apps.length === 0) {
                   // Try fetching from Firebase, fallback to Mock
                   try {
                       // Simulation of DB fetch
                       State.apps = State.mockApps.map(a => ({
                           ...a, 
                           // Add random images if placeholder
                           icon: a.icon.includes('via') ? `https://ui-avatars.com/api/?name=${a.name}&background=random&size=128` : a.icon 
                       })); 
                   } catch(e) { State.apps = State.mockApps; }
                }

                const categories = ['All', 'Games', 'Tools', 'Finance', 'Education'];
                
                const filtered = State.apps.filter(app => {
                    const matchSearch = app.name.toLowerCase().includes(State.searchQuery.toLowerCase());
                    const matchCat = State.selectedCategory === 'All' || app.category === State.selectedCategory;
                    return matchSearch && matchCat;
                });

                UI.container.innerHTML = `
                    <div style="animation: fadeIn 0.5s ease-out">

                const installedApps = LocalStore.getLibrary();
                
                let content = '';
                if (installedApps.length === 0) {
                    content = `
                        <div class="empty-state">

                                    <button class="btn-download installed" style="width:auto; padding:8px 16px;">

                                </div>
                            `).join('')}

                if (!State.currentUser) {

                }
                const user = State.currentUser;
                const libCount = LocalStore.getLibrary().length;

                UI.container.innerHTML = `

                                ${user.email[0].toUpperCase()}
                            </div>
                            <h2 style="font-size:22px;">${user.email.split('@')[0]}</h2>
                            <p style="color:var(--text-muted); font-size:14px;">${user.email}</p>
                            
                            <div style="display:flex; justify-content:center; gap:30px; margin-top:24px;">

                                    <div style="font-size:20px; font-weight:700;">${libCount}</div>
                                    <div style="font-size:12px; color:var(--text-muted);">Apps</div>
                                </div>
                                <div>
                                    <div style="font-size:20px; font-weight:700;">Basic</div>
                                    <div style="font-size:12px; color:var(--text-muted);">Plan</div>
                                </div>
                            </div>
                        </div>

                        <div class="content-list">
                            <button onclick="Logic.clearData()" class="app-card list-view" style="justify-content:flex-start; cursor:pointer;">
                                <i class="fas fa-trash-alt" style="font-size:20px; color:var(--warning); width:40px;"></i>
                                <span>Clear Local Data</span>
                            </button>
                            <button onclick="Logic.logout()" class="app-card list-view" style="justify-content:flex-start; cursor:pointer;">
                                <i class="fas fa-sign-out-alt" style="font-size:20px; color:var(--primary); width:40px;"></i>
                                <span>Sign Out</span>
                            </button>
                        </div>
                    </div>
                `;
            },

            // --- VIEW: AUTH ---
            renderAuth: () => {
                UI.container.innerHTML = `
                    <div style="height:80vh; display:flex; flex-direction:column; justify-content:center; padding:30px; text-align:center; animation: scaleIn 0.4s;">
                        <div class="logo-icon nepal-gradient" style="width:80px; height:80px; margin:0 auto 30px; font-size:40px;">
                            <i class="fas fa-mountain"></i>
                        </div>
                        <h1 style="margin-bottom:10px;">Welcome Back</h1>
                        <p style="color:var(--text-muted); margin-bottom:40px;">Sign in to sync your preferences</p>

                        <input type="email" id="auth-email" placeholder="Email" class="search-input" style="margin-bottom:15px; background:var(--surface-1);">
                        <input type="password" id="auth-pass" placeholder="Password" class="search-input" style="margin-bottom:25px; background:var(--surface-1);">

                        <button onclick="Logic.login()" class="btn-action nepal-gradient" style="color:white; padding:16px;">Sign In</button>
                        <p style="margin-top:20px; font-size:13px; color:var(--text-muted);">Test Account: user@nepal.com / 123456</p>
                    </div>
                `;
            },

            // --- COMPONENTS ---
            Components: {
                appCard: (app) => {
                    const isInstalled = LocalStore.isInstalled(app.id);
                    return `
                        <div class="app-card" onclick="ui.openDetails('${app.id}')">
                            <img src="${app.icon}" class="app-icon-img" loading="lazy">
                            <div style="margin-bottom:8px;">
                                <h3 style="font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${app.name}</h3>
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
                                    <span style="font-size:12px; color:var(--text-muted);">${app.category}</span>
                                    <span style="font-size:12px; color:var(--warning);"><i class="fas fa-star"></i> ${app.rating}</span>
                                </div>
                            </div>
                            ${isInstalled ? 
                                `<button class="btn-action btn-download installed" onclick="event.stopPropagation()">Installed</button>` :
                                `<button class="btn-action btn-download" onclick="event.stopPropagation(); Logic.downloadApp('${app.id}')"><i class="fas fa-download"></i> Get</button>`
                            }
                        </div>
                    `;
                }
            },

            openDetails: (id) => {
                const app = State.apps.find(a => a.id === id);
                if(!app) return;

                const isInstalled = LocalStore.isInstalled(id);
                const modal = document.getElementById('detail-modal');
                const content = document.getElementById('modal-content');

                content.innerHTML = `
                    <div style="height:200px; position:relative;">
                        <img src="${app.icon}" style="width:100%; height:100%; object-fit:cover; opacity:0.3; mask-image: linear-gradient(to bottom, black, transparent);">
                        <div style="position:absolute; bottom:20px; left:20px; right:20px; display:flex; gap:20px; align-items:flex-end;">
                            <img src="${app.icon}" style="width:100px; height:100px; border-radius:24px; box-shadow:0 10px 30px rgba(0,0,0,0.5); border:2px solid var(--surface-1);">
                            <div style="flex:1;">
                                <h2 style="font-size:24px; font-weight:700; line-height:1.2;">${app.name}</h2>
                                <p style="color:var(--primary); font-weight:600;">${app.category}</p>
                            </div>
                        </div>
                    </div>
                    
                    <div style="padding:24px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:24px; background:var(--surface-2); padding:16px; border-radius:16px;">
                            <div style="text-align:center;">
                                <div style="font-weight:700; font-size:18px;">${app.rating} <i class="fas fa-star" style="color:var(--warning); font-size:14px;"></i></div>
                                <div style="font-size:12px; color:var(--text-muted);">Rating</div>
                            </div>
                            <div style="text-align:center; border-left:1px solid var(--glass-border); border-right:1px solid var(--glass-border); padding:0 20px;">
                                <div style="font-weight:700; font-size:18px;">${app.size}</div>
                                <div style="font-size:12px; color:var(--text-muted);">Size</div>
                            </div>
                            <div style="text-align:center;">
                                <div style="font-weight:700; font-size:18px;">${app.version}</div>
                                <div style="font-size:12px; color:var(--text-muted);">Version</div>
                            </div>
                        </div>

                        <!-- Action Button -->
                        <div id="modal-action-area">
                            ${isInstalled ? 
                                `<button class="btn-action nepal-gradient" style="color:white; box-shadow:0 10px 20px var(--primary-glow);">Open App</button>` :
                                `<button class="btn-action nepal-gradient" style="color:white; box-shadow:0 10px 20px var(--primary-glow);" onclick="Logic.downloadApp('${app.id}', true)">Download APK</button>`
                            }
                        </div>
                        
                        <!-- Progress Bar Area -->
                        <div class="progress-container" id="modal-progress">
                            <div class="progress-fill" id="modal-progress-fill"></div>
                        </div>
                        <p id="modal-status" style="text-align:center; font-size:12px; color:var(--text-muted); margin-top:8px; opacity:0;"></p>

                        <div style="margin-top:30px;">
                            <h3 style="font-size:18px; margin-bottom:12px;">About this app</h3>
                            <p style="color:var(--text-muted); line-height:1.6; font-size:14px;">
                                Experience the best of ${app.name}. Optimized for Nepali users with high-speed performance and dark mode support. This premium version includes exclusive features unlocked.
                            </p>
                        </div>

                        <div style="margin-top:30px;">
                            <h3 style="font-size:18px; margin-bottom:12px;">Preview</h3>
                            <div style="display:flex; gap:12px; overflow-x:auto; padding-bottom:10px;">
                                <div style="min-width:200px; height:120px; background:var(--surface-2); border-radius:12px;"></div>
                                <div style="min-width:200px; height:120px; background:var(--surface-2); border-radius:12px;"></div>
                            </div>
                        </div>
                    </div>
                `;

                modal.classList.add('open');
            },

            closeModal: (e) => {
                if(e.target.id === 'detail-modal') {
                    document.getElementById('detail-modal').classList.remove('open');
                }
            }
        };

        // --- LOGIC HANDLERS ---
        const Logic = {
            login: async () => {
                const email = document.getElementById('auth-email').value;
                const pass = document.getElementById('auth-pass').value;
                if(!email || !pass) return UI.showToast("Please enter credentials", "error");

                try {
                    await signInWithEmailAndPassword(auth, email, pass);
                } catch(e) {
                    // For demo purposes, allow login with any format if firebase fails
                    State.currentUser = { email: email, uid: 'local_user' };
                    UI.renderHeaderAvatar();
                    router.navigate('browse');
                    UI.showToast("Logged in locally", "success");
                }
            },

            logout: async () => {
                try { await signOut(auth); } catch(e) {}
                State.currentUser = null;
                UI.renderHeaderAvatar();
                router.navigate('auth');
            },

            handleSearch: (val) => {
                State.searchQuery = val;
                if(State.currentView === 'browse') UI.renderBrowse();
            },

            setCategory: (cat) => {
                State.selectedCategory = cat;
                UI.renderBrowse();
            },

            // CORE DOWNLOAD LOGIC
            downloadApp: (id, fromModal = false) => {
                const app = State.apps.find(a => a.id === id);
                if(!app) return;

                // UI Feedback
                UI.showToast(`Starting download: ${app.name}...`);
                
                let progressFill, statusText;
                
                if(fromModal) {
                    const btn = document.querySelector('#modal-action-area button');
                    btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> Downloading...`;
                    btn.style.opacity = "0.7";
                    document.getElementById('modal-progress').classList.add('active');
                    progressFill = document.getElementById('modal-progress-fill');
                    statusText = document.getElementById('modal-status');
                    statusText.style.opacity = 1;
                }

                // Simulate Download Progress
                let progress = 0;
                const interval = setInterval(() => {
                    progress += Math.random() * 5 + 1; // Random increment
                    if(progress > 100) progress = 100;

                    if(fromModal) {
                        progressFill.style.width = `${progress}%`;
                        statusText.innerText = `${Math.floor(progress)}% • ${(parseInt(app.size) * (progress/100)).toFixed(1)} MB downloaded`;
                    }

                    if(progress === 100) {
                        clearInterval(interval);
                        Logic.finishDownload(app, fromModal);
                    }
                }, 100);
            },

            finishDownload: (app, fromModal) => {
                // 1. Save to Local Storage (Update Logic)
                LocalStore.addToLibrary(app);

                // 2. Trigger Fake File Download (Browser behavior)
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(app));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href",     dataStr);
                downloadAnchorNode.setAttribute("download", app.name.replace(/\s/g, '_') + "_v" + app.version + ".apk");
                document.body.appendChild(downloadAnchorNode); // required for firefox
                downloadAnchorNode.click();
                downloadAnchorNode.remove();

                // 3. UI Update
                UI.showToast(`${app.name} Installed Successfully!`, "success");
                
                if(fromModal) {
                    const area = document.getElementById('modal-action-area');
                    area.innerHTML = `<button class="btn-action nepal-gradient" style="color:white;">Open App</button>`;
                    document.getElementById('modal-status').innerText = "Installation Complete";
                }

                // Refresh UI if in browse
                if(State.currentView === 'browse') UI.renderBrowse();
            },

            clearData: () => {
                if(confirm("Delete all local downloads?")) {
                    LocalStore.clearLibrary();
                    UI.showToast("Library cleared", "warning");
                    router.navigate('library');
                }
            }
        };

        // --- ROUTER ---
        const router = {
            navigate: (view) => {
                State.currentView = view;
                
                // Update Nav UI
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                const navIndex = view === 'browse' ? 0 : view === 'library' ? 1 : 2;
                if(view !== 'auth') document.querySelectorAll('.nav-btn')[navIndex].classList.add('active');

                // Render View
                if(view === 'browse') UI.renderBrowse();
                else if(view === 'library') UI.renderLibrary();
                else if(view === 'profile') UI.renderProfile();
                else if(view === 'auth') UI.renderAuth();
            }
        };

        // --- INITIALIZATION ---
        window.onload = () => {
            // Check auth state
            if(auth) {
                onAuthStateChanged(auth, (user) => {
                    State.currentUser = user;
                    UI.renderHeaderAvatar();
                });
            } else {
                UI.renderHeaderAvatar(); // Render guest state
            }
            
            // Initial render
            router.navigate('browse');
        };

        // Export to window for HTML events
        window.router = router;
        window.ui = UI;
        window.Logic = Logic;

    </script>
</body>
</html>
