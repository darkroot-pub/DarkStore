<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DarkStore • System Upgrade</title>
    
    <!-- PRELOAD FONTS FOR INSTANT RENDER -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        /* --- RESET & VARIABLES --- */
        :root {
            --bg-dark: #050507;
            --neon-green: #00ff88;
            --neon-green-dim: rgba(0, 255, 136, 0.1);
            --neon-red: #ff3333;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #8899a6;
            --ease-elastic: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 136, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 51, 51, 0.05) 0%, transparent 20%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* --- SCANLINE OVERLAY --- */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        /* --- MAIN CONTAINER --- */
        .container {
            width: 90%;
            max-width: 480px;
            position: relative;
            z-index: 10;
            padding: 20px;
        }

        /* --- GLASS CARD --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            animation: cardFloat 6s ease-in-out infinite;
        }

        /* Animated Border Gradient */
        .glass-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 32px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(0,255,136,0.5), transparent 50%, rgba(255,51,51,0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- LOGO & HEADER --- */
        .brand-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            padding: 8px 20px;
            border-radius: 50px;
            margin-bottom: 30px;
        }

        .brand-icon {
            color: var(--neon-green);
            font-size: 1.2rem;
            animation: pulse 2s infinite;
        }

        .brand-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* --- GLITCH TITLE --- */
        .glitch-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .main-title {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: -2px;
            color: #fff;
            position: relative;
            z-index: 1;
        }
        
        /* Mobile Scaling */
        @media (max-width: 400px) {
            .main-title { font-size: 2.4rem; }
        }

        .sub-text {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        /* --- COUNTDOWN TIMER --- */
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 40px;
        }

        .time-box {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 15px 5px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.2s var(--ease-elastic);
        }

        .time-box:active { transform: scale(0.95); }

        .time-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--neon-green);
            display: block;
            line-height: 1;
            margin-bottom: 5px;
            text-shadow: 0 0 10px var(--neon-green-dim);
        }

        .time-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #556677;
        }

        /* --- STATUS BADGES --- */
        .status-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
        }

        .status-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .dot.red { background: var(--neon-red); box-shadow: 0 0 8px var(--neon-red); animation: blink 1s infinite; }
        .dot.green { background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); }

        .status-val {
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }
        .status-val.locked { color: var(--neon-red); }
        .status-val.active { color: var(--neon-green); }

        /* --- ANIMATIONS --- */
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* --- FOOTER --- */
        .footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #445566;
            letter-spacing: 1px;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #111;
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--neon-green);
            width: 85%;
            box-shadow: 0 0 10px var(--neon-green);
            position: relative;
        }
        
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transform: translateX(-100%);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="glass-panel">
            <!-- Brand -->
            <div class="brand-pill">
                <span class="brand-icon">◆</span>
                <span class="brand-text">DARKSTORE SYS</span>
            </div>

            <!-- Title -->
            <div class="glitch-wrapper">
                <h1 class="main-title">SYSTEM<br><span style="color:var(--neon-green);">UPDATE</span></h1>
            </div>

            <p class="sub-text">
                Core infrastructure is rebuilding. Access is temporarily restricted to whitelisted IPs.
            </p>

            <!-- Countdown -->
            <div class="countdown-grid" id="timer">
                <div class="time-box">
                    <span class="time-val" id="d">02</span>
                    <span class="time-label">Days</span>
                </div>
                <div class="time-box">
                    <span class="time-val" id="h">14</span>
                    <span class="time-label">Hrs</span>
                </div>
                <div class="time-box">
                    <span class="time-val" id="m">30</span>
                    <span class="time-label">Min</span>
                </div>
                <div class="time-box">
                    <span class="time-val" id="s">05</span>
                    <span class="time-label">Sec</span>
                </div>
            </div>

            <!-- Status Rows -->
            <div class="status-container">
                <div class="status-row">
                    <span class="status-label"><div class="dot red"></div> Public Access</span>
                    <span class="status-val locked">LOCKED</span>
                </div>
                <div class="status-row">
                    <span class="status-label"><div class="dot green"></div> Dev Server</span>
                    <span class="status-val active">ONLINE</span>
                </div>
            </div>
            
            <!-- Fake Progress -->
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

            <div class="footer">
                ID: 885-ACCESS-DENIED • V2.0.4
            </div>
        </div>
    </div>

    <script>
        // --- PERSISTENT COUNTDOWN LOGIC ---
        (function() {
            const STORAGE_KEY = 'darkstore_update_target';
            const DURATION_DAYS = 29;
            
            function getTargetDate() {
                let stored = localStorage.getItem(STORAGE_KEY);
                let target;

                if (stored && new Date(stored) > new Date()) {
                    target = new Date(stored);
                } else {
                    // Set new target: Now + 3 Days + Random hours
                    target = new Date();
                    target.setDate(target.getDate() + DURATION_DAYS);
                    target.setHours(target.getHours() + Math.floor(Math.random() * 12));
                    localStorage.setItem(STORAGE_KEY, target.toISOString());
                }
                return target;
            }

            const targetDate = getTargetDate();
            
            function updateTimer() {
                const now = new Date();
                const diff = targetDate - now;

                if (diff <= 0) {
                    // Reset if expired
                    localStorage.removeItem(STORAGE_KEY);
                    location.reload(); 
                    return;
                }

                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const m = Math.floor((diff / 1000 / 60) % 60);
                const s = Math.floor((diff / 1000) % 60);

                document.getElementById('d').innerText = d.toString().padStart(2, '0');
                document.getElementById('h').innerText = h.toString().padStart(2, '0');
                document.getElementById('m').innerText = m.toString().padStart(2, '0');
                document.getElementById('s').innerText = s.toString().padStart(2, '0');
            }

            setInterval(updateTimer, 1000);
            updateTimer(); // Init immediately
        })();

        // --- HAPTIC FEEDBACK SIMULATION (Mobile) ---
        // Adds subtle vibration when touching timer elements (Android only)
        document.querySelectorAll('.time-box').forEach(box => {
            box.addEventListener('click', () => {
                if (navigator.vibrate) navigator.vibrate(10);
            });
        });
    </script>
</body>
</html>
