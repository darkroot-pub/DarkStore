name: darkstore_admin
description: DarkStore Admin (Flutter) - no FCM, admin tools only
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_database: ^11.1.6
  supabase_flutter: 2.8.4
  http: ^1.2.2
  google_sign_in: ^6.2.2
  image_picker: ^1.1.2
  firebase_storage: ^12.3.6
flutter:
  uses-material-design: true

# supabase_flutter pulls in app_links; its newest versions need Flutter >= 3.27 but this
# project builds on Flutter 3.24.5. (Deep links are never used: login is Firebase.)
dependency_overrides:
  app_links: 6.3.2
